{% extends "base.html" %}
{% block title %}Forgot Password — WritersWorld{% endblock %}
{% block page_title %}Forgot Password{% endblock %}
{% block content %}
<div style="max-width:400px; margin:0 auto; padding-top:20px;">
  <div class="card">
    <h2 style="color:var(--green); margin-bottom:8px; text-align:center;">🔐 Forgot Password</h2>
    <p class="text-dim" style="text-align:center; font-size:0.88rem; margin-bottom:20px;">
      Enter your email and admin will reset your password and notify you.
    </p>
    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="btn btn-green w-full">Send Reset Request</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:0.88rem;">
      <a href="{{ url_for('login') }}">← Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
