{% extends "base.html" %}
{% block title %}Edit Profile — WritersWorld{% endblock %}
{% block page_title %}Edit Profile{% endblock %}
{% block content %}
<div style="max-width:500px; margin:0 auto;">
  <div class="card">
    <h3 style="color:var(--green); margin-bottom:20px;">✏️ Edit Profile</h3>
    <form method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label>Avatar Image</label>
        <input type="file" name="avatar" id="coverInput" accept="image/*">
        <img id="coverPreview" style="display:none; width:80px; height:80px; border-radius:50%; object-fit:cover; margin-top:8px;">
        {% if current_user.avatar and current_user.avatar != 'default.png' %}
        <img src="{{ url_for('static', filename='uploads/' + current_user.avatar) }}" style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin-top:8px; border:2px solid var(--green);">
        {% endif %}
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea name="bio" placeholder="Tell us about yourself...">{{ current_user.bio }}</textarea>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button type="submit" class="btn btn-green">Save Changes</button>
        <a href="{{ url_for('profile', user_id=current_user.id) }}" class="btn btn-gray">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
