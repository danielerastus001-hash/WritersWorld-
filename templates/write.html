{% extends "base.html" %}
{% block title %}{% if editing %}Edit{% else %}Write{% endif %} Story — WritersWorld{% endblock %}
{% block page_title %}{% if editing %}Edit Story{% else %}Write Story{% endif %}{% endblock %}
{% block content %}
<form method="POST" enctype="multipart/form-data" id="writeForm">
  <div class="form-group">
    <label>Story Title</label>
    <input type="text" name="title" id="storyTitle" placeholder="Enter your story title..." required value="{{ story.title if story else '' }}">
  </div>
  <div class="form-group">
    <label>Genre</label>
    <select name="genre" id="storyGenre">
      {% for g in genres %}
      <option value="{{ g }}" {% if story and story.genre == g %}selected{% endif %}>{{ g }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label>Your Story <span id="wordCount" style="color:var(--text-dim); font-size:0.8rem; margin-left:8px;"></span></label>
    <textarea name="content" id="storyContent" class="editor-area" placeholder="Start writing your story here...&#10;&#10;You can use blank lines to separate sections.&#10;No chapters — just write freely." required>{{ story.content if story else '' }}</textarea>
  </div>
  <div style="color:var(--text-dim); font-size:0.8rem; margin-bottom:8px;" id="autoSaveStatus"></div>
  
  <input type="hidden" name="publish" id="publishInput" value="false">
  <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;">
    <button type="submit" class="btn btn-gray" onclick="setPublish('false')">💾 Save Draft</button>
    <button type="submit" class="btn btn-green" id="publishBtn" onclick="setPublish('true')">🌐 Publish Story</button>
    <a href="{{ url_for('my_stories') }}" class="btn btn-gray">Cancel</a>
  </div>
</form>
{% endblock %}
