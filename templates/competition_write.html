{% extends "base.html" %}
{% block title %}Enter Competition — WritersWorld{% endblock %}
{% block page_title %}Competition Entry{% endblock %}
{% block content %}
<div class="card" style="margin-bottom:16px;">
  <h3 style="color:var(--green);">🏆 {{ comp.title }}</h3>
  <p class="text-dim" style="font-size:0.85rem;">{{ comp.end_date.strftime('Closes %d %b %Y') }}</p>
</div>

<form method="POST">
  <div class="form-group">
    <label>Entry Title</label>
    <input type="text" name="title" placeholder="Your story title..." required value="{{ entry.title if entry else '' }}">
  </div>
  <div class="form-group">
    <label>Your Story <span class="text-dim" style="font-size:0.8rem;">(No chapters — write freely)</span></label>
    <textarea name="content" id="storyContent" class="editor-area" placeholder="Write your competition entry here..." required>{{ entry.content if entry else '' }}</textarea>
  </div>
  <div class="card" style="margin-bottom:16px;">
    <h4 style="color:var(--green); margin-bottom:12px;">Review Options</h4>
    <div class="checkbox-group">
      <label>
        <input type="checkbox" name="expert_review" {% if entry and entry.expert_review %}checked{% endif %}>
        <div>
          <strong>Expert Review</strong>
          <div class="text-dim" style="font-size:0.82rem;">Admin will personally review and critique your story</div>
        </div>
      </label>
      <label>
        <input type="checkbox" name="peer_review" {% if entry and entry.peer_review %}checked{% endif %}>
        <div>
          <strong>Peer Review</strong>
          <div class="text-dim" style="font-size:0.82rem;">Other authors can review your story using guided questions</div>
        </div>
      </label>
    </div>
  </div>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button type="submit" class="btn btn-green">{% if entry %}Update Entry{% else %}Submit Entry{% endif %}</button>
    <a href="{{ url_for('competition_view', comp_id=comp.id) }}" class="btn btn-gray">Cancel</a>
  </div>
</form>
{% endblock %}
